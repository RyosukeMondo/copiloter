<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-width: 380px;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .status-dot.inactive {
      background: #f59e0b;
      animation: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .status-text {
      font-size: 14px;
    }

    .conv-id {
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      color: #a5b4fc;
      word-break: break-all;
    }

    .no-conv {
      color: #888;
      font-style: italic;
    }

    .endpoint-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 11px;
      color: #a5b4fc;
      word-break: break-all;
      position: relative;
      margin-top: 8px;
    }

    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(99, 102, 241, 0.3);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    .copy-btn.copied {
      background: #22c55e;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="logo">🤖</span>
    <h1>Copiloter</h1>
  </div>

  <div class="section">
    <div class="section-title">Status</div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Checking...</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Current Conversation</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="conv-id" id="convId" style="flex: 1;">
        <span class="no-conv">Not on a Copilot chat page</span>
      </div>
      <button class="copy-btn" id="copyIdBtn" style="position: static; display: none;">📋</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Send Message API</div>
    <div class="endpoint-box" id="endpointBox">
      curl -X POST http://localhost:3001/api/send \<br>
      &nbsp;&nbsp;-H "Content-Type: application/json" \<br>
      &nbsp;&nbsp;-d '{"message": "Hello!"}'
    </div>
    <button class="copy-btn" id="copyBtn">📋 Copy</button>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="viewBtn">
      📊 View Dashboard
    </button>
    <button class="btn btn-secondary" id="refreshBtn">
      🔄 Refresh
    </button>
  </div>

  <div class="footer">
    Server: http://localhost:3001
  </div>

  <script src="popup.js"></script>
</body>

</html>
